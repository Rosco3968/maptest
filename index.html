<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCESD#3 // Street Recognition Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13; --panel:#11161d; --panel-2:#151b23; --line:#22303c;
    --amber:#ffb703; --amber-dim:#8a6a1f; --red:#e5484d; --green:#3ddc84;
    --text:#e6edf3; --dim:#6b7d8c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;}
  .scanlines{pointer-events:none;position:fixed;inset:0;z-index:60;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,0.018) 0px,rgba(255,255,255,0.018) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:overlay;}
  .cad-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1218,#0a0e13);
    font-size:13px;letter-spacing:0.06em;}
  .cad-left{color:var(--amber);font-weight:600;}
  .cad-left .dim{color:var(--dim);margin:0 6px;}
  .cad-right{color:var(--dim);}
  #clock{color:var(--text);}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 16px 60px;}
  .title-block{text-align:center;margin-bottom:18px;}
  .title-block h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,5.5vw,48px);
    letter-spacing:0.03em;color:var(--text);margin:0 0 4px;line-height:1;}
  .title-block h1 span{color:var(--amber);}
  .title-block p{color:var(--dim);font-size:12.5px;letter-spacing:0.08em;margin:0;text-transform:uppercase;}
  .cursor{display:inline-block;width:9px;height:1em;background:var(--amber);margin-left:6px;vertical-align:middle;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .tabs{display:flex;gap:2px;background:var(--line);border:1px solid var(--line);margin-bottom:16px;border-radius:6px;overflow:hidden;}
  .tab{flex:1;padding:11px 6px;background:var(--panel);color:var(--dim);border:none;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.08em;cursor:pointer;transition:background .15s,color .15s;}
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--amber);color:#1a1206;font-weight:700;}
  .tab:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}
  .view{display:none;}
  .view.active{display:block;}

  .stats-bar{margin-top:16px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 20px;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--amber);letter-spacing:0.02em;}
  .stat-label{font-size:9.5px;color:var(--dim);letter-spacing:0.1em;}
  .reset-btn{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;padding:9px 14px;border-radius:6px;cursor:pointer;}
  .reset-btn:hover{border-color:var(--red);color:var(--red);}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.04em;padding:12px 18px;
    border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s;}
  .btn:hover{border-color:var(--amber-dim);}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .btn-next{border-color:var(--amber);color:var(--amber);}
  .btn-next:hover{background:rgba(255,183,3,0.08);}

  .map-top{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:12px;}
  .find-label{font-size:10.5px;color:var(--amber-dim);letter-spacing:0.1em;margin-bottom:6px;}
  .find-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,5vw,32px);color:var(--text);letter-spacing:0.02em;}
  .approx-note{font-size:10.5px;color:#7bb3ff;letter-spacing:0.05em;margin-top:4px;}
  .marker.correct.approx{border-color:#7bb3ff;box-shadow:0 0 0 4px rgba(123,179,255,0.25),0 0 18px rgba(123,179,255,0.6);}
  .map-controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .zoom-btn{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--text);font-size:16px;cursor:pointer;line-height:1;}
  .zoom-btn:hover{border-color:var(--amber-dim);}
  .zoom-readout{font-size:11px;color:var(--dim);min-width:44px;text-align:center;}
  .msg{font-size:12.5px;min-height:18px;margin-top:8px;letter-spacing:0.02em;}
  .msg.ok{color:var(--green);}
  .msg.bad{color:var(--red);}
  .msg.hint{color:var(--dim);}

  .map-frame{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;}
  .map-scroll{width:100%;height:min(62vh,640px);overflow:auto;position:relative;cursor:grab;
    -webkit-overflow-scrolling:touch;}
  .map-scroll.grabbing{cursor:grabbing;}
  .map-inner{position:relative;}
  .map-inner img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
  .marker{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5;}
  .marker.correct{width:34px;height:34px;border-radius:50%;border:3px solid var(--green);
    box-shadow:0 0 0 4px rgba(61,220,132,0.25),0 0 18px rgba(61,220,132,0.6);}
  .marker.wrong{width:26px;height:26px;}
  .marker.wrong::before,.marker.wrong::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:3px;
    background:var(--red);border-radius:2px;box-shadow:0 0 8px rgba(229,72,77,0.7);}
  .marker.wrong::before{transform:translate(-50%,-50%) rotate(45deg);}
  .marker.wrong::after{transform:translate(-50%,-50%) rotate(-45deg);}
  .marker.reveal{width:20px;height:20px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 0 6px rgba(255,183,3,0.25),0 0 20px rgba(255,183,3,0.8);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.35);}}

  .map-footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;}
  .not-found-note{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.6;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:12px 16px;}
  .not-found-note b{color:var(--amber-dim);}

  .study-tabs{display:flex;gap:2px;background:var(--line);border:1px solid var(--line);margin-bottom:14px;border-radius:6px;overflow:hidden;}
  .study-tab{flex:1;padding:9px 6px;background:var(--panel-2);color:var(--dim);border:none;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;cursor:pointer;}
  .study-tab.active{background:#3a2e10;color:var(--amber);font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 220px;gap:14px;}
  @media (max-width:680px){.stage{grid-template-columns:1fr;}.log-panel{order:2;}}
  .quiz-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 24px;
    min-height:240px;display:flex;flex-direction:column;justify-content:center;position:relative;}
  .mode-tag{position:absolute;top:14px;left:16px;font-size:10.5px;color:var(--amber-dim);letter-spacing:0.1em;}
  .q-number{font-size:11px;color:var(--dim);letter-spacing:0.08em;margin-bottom:14px;}
  .prompt{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,5vw,34px);letter-spacing:0.02em;color:var(--text);margin:0 0 22px;line-height:1.15;}
  .flash-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-know{border-color:var(--green);color:var(--green);}
  .btn-know:hover{background:rgba(61,220,132,0.08);}
  .btn-study{border-color:var(--red);color:var(--red);}
  .btn-study:hover{background:rgba(229,72,77,0.08);}
  .mc-options{display:grid;gap:10px;}
  .mc-opt{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:14.5px;padding:13px 16px;border-radius:6px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s;}
  .mc-opt:hover{border-color:var(--amber-dim);}
  .mc-opt.correct{border-color:var(--green);background:rgba(61,220,132,0.1);color:var(--green);}
  .mc-opt.wrong{border-color:var(--red);background:rgba(229,72,77,0.1);color:var(--red);}
  .mc-opt[disabled]{cursor:default;}
  .type-row{display:flex;gap:10px;flex-wrap:wrap;}
  .type-input{flex:1;min-width:200px;font-family:'IBM Plex Mono',monospace;font-size:15px;padding:12px 14px;
    border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);}
  .type-input:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  .feedback{margin-top:14px;font-size:13px;letter-spacing:0.03em;min-height:20px;}
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .next-row{margin-top:18px;}
  .log-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;font-size:11.5px;max-height:340px;overflow-y:auto;}
  .log-title{color:var(--amber-dim);letter-spacing:0.1em;font-size:10.5px;margin-bottom:10px;}
  #logList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  #logList li{border-left:2px solid var(--line);padding-left:8px;color:var(--dim);line-height:1.4;}
  #logList li.ok{border-color:var(--green);}
  #logList li.bad{border-color:var(--red);}
  #logList li .code{font-weight:700;}
  #logList li.ok .code{color:var(--green);}
  #logList li.bad .code{color:var(--red);}
</style>

<script>
function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock, 1000);
tickClock();

document.querySelectorAll(".tabs > .tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tabs > .tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const view = tab.getAttribute("data-view");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById(view).classList.add("active");
  });
});

(function(){
  const scrollEl = document.getElementById("mapScroll");
  const innerEl = document.getElementById("mapInner");
  const imgEl = document.getElementById("mapImg");
  const findNameEl = document.getElementById("findName");
  const msgEl = document.getElementById("mapMsg");
  const zoomReadout = document.getElementById("zoomReadout");

  let zoom = 1.0;
  let pool = [...MAP_HITBOXES];
  let current = null;
  let awaitingNext = false;
  let wrongAttempts = 0;

  let mapStats = JSON.parse(localStorage.getItem("hfr_map_stats") || '{"found":[],"correct":0,"total":0,"streak":0}');

  function saveMapStats(){
    localStorage.setItem("hfr_map_stats", JSON.stringify(mapStats));
    renderMapStats();
  }
  function renderMapStats(){
    document.getElementById("mapFound").textContent = mapStats.found.length;
    document.getElementById("mapStreak").textContent = mapStats.streak;
    const acc = mapStats.total ? Math.round(mapStats.correct/mapStats.total*100) : 0;
    document.getElementById("mapAcc").textContent = acc + "%";
  }

  function setZoomWidth(){
    const baseWidth = scrollEl.clientWidth;
    const px = Math.round(baseWidth * zoom);
    innerEl.style.width = px + "px";
    zoomReadout.textContent = Math.round(zoom*100) + "%";
  }

  function adjustZoom(delta){
    const oldScrollW = innerEl.offsetWidth || 1;
    const oldScrollH = innerEl.offsetHeight || 1;
    const centerXRatio = (scrollEl.scrollLeft + scrollEl.clientWidth/2) / oldScrollW;
    const centerYRatio = (scrollEl.scrollTop + scrollEl.clientHeight/2) / oldScrollH;

    zoom = Math.min(4.5, Math.max(1, zoom + delta));
    setZoomWidth();

    requestAnimationFrame(()=>{
      const newW = innerEl.offsetWidth;
      const newH = innerEl.offsetHeight;
      scrollEl.scrollLeft = centerXRatio*newW - scrollEl.clientWidth/2;
      scrollEl.scrollTop = centerYRatio*newH - scrollEl.clientHeight/2;
    });
  }

  document.getElementById("zoomIn").addEventListener("click", ()=>adjustZoom(0.5));
  document.getElementById("zoomOut").addEventListener("click", ()=>adjustZoom(-0.5));
  window.addEventListener("resize", ()=>{ if(zoom===1) setZoomWidth(); });

  imgEl.addEventListener("load", ()=>{ setZoomWidth(); });
  if(imgEl.complete) setZoomWidth();

  let dragging=false, startX=0, startY=0, startLeft=0, startTop=0, movedDuringDrag=false;
  scrollEl.addEventListener("mousedown", e=>{
    dragging=true; movedDuringDrag=false; scrollEl.classList.add("grabbing");
    startX=e.clientX; startY=e.clientY;
    startLeft=scrollEl.scrollLeft; startTop=scrollEl.scrollTop;
  });
  window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) movedDuringDrag=true;
    scrollEl.scrollLeft = startLeft - dx;
    scrollEl.scrollTop = startTop - dy;
  });
  window.addEventListener("mouseup", ()=>{ dragging=false; scrollEl.classList.remove("grabbing"); });

  function clearMarkers(){ innerEl.querySelectorAll(".marker").forEach(m=>m.remove()); }

  function placeMarker(cls, xPct, yPct){
    const m = document.createElement("div");
    m.className = "marker " + cls;
    m.style.left = xPct + "%";
    m.style.top = yPct + "%";
    innerEl.appendChild(m);
    return m;
  }

  function panTo(cxPct, cyPct){
    const w = innerEl.offsetWidth, h = innerEl.offsetHeight;
    scrollEl.scrollLeft = (cxPct/100)*w - scrollEl.clientWidth/2;
    scrollEl.scrollTop = (cyPct/100)*h - scrollEl.clientHeight/2;
  }

  function nextTarget(){
    clearMarkers();
    msgEl.textContent = ""; msgEl.className = "msg";
    awaitingNext = false; wrongAttempts = 0;
    if(pool.length === 0) pool = [...MAP_HITBOXES];
    const unfound = pool.filter(h=>!mapStats.found.includes(h.name));
    const choices = unfound.length ? unfound : pool;
    current = choices[Math.floor(Math.random()*choices.length)];
    findNameEl.innerHTML = current.name;
    const note = document.getElementById("approxNote");
    if(current.approx){
      note.style.display = "block";
      note.textContent = "This one wasn't printed on the map itself — location estimated from its real-world address, so give some extra leeway.";
    } else {
      note.style.display = "none";
    }
  }

  function markFoundIfNew(name){ if(!mapStats.found.includes(name)) mapStats.found.push(name); }

  scrollEl.addEventListener("click", e=>{
    if(!current || awaitingNext || movedDuringDrag){ movedDuringDrag=false; return; }
    const rect = innerEl.getBoundingClientRect();
    const xPct = (e.clientX - rect.left) / rect.width * 100;
    const yPct = (e.clientY - rect.top) / rect.height * 100;
    if(xPct<0||xPct>100||yPct<0||yPct>100) return;

    const hit = xPct >= current.x && xPct <= current.x+current.w &&
                yPct >= current.y && yPct <= current.y+current.h;

    mapStats.total++;
    if(hit){
      mapStats.correct++; mapStats.streak++;
      markFoundIfNew(current.name);
      placeMarker(current.approx ? "correct approx" : "correct", current.cx, current.cy);
      msgEl.textContent = current.approx ? "10-4 — close enough, that's the area." : "10-4 — that's it.";
      msgEl.className = "msg ok";
      awaitingNext = true;
      saveMapStats();
      setTimeout(nextTarget, 850);
    } else {
      mapStats.streak = 0;
      wrongAttempts++;
      placeMarker("wrong", xPct, yPct);
      const dist = Math.hypot(xPct-current.cx, yPct-current.cy);
      if(dist < 8) msgEl.textContent = "Close — right area, try again.";
      else if(dist < 20) msgEl.textContent = "Same general neighborhood. Keep looking.";
      else msgEl.textContent = "Way off. Zoom out or try Hint.";
      msgEl.className = "msg bad";
      saveMapStats();
    }
  });

  document.getElementById("hintBtn").addEventListener("click", ()=>{
    if(!current) return;
    const ns = current.cy < 50 ? "north" : "south";
    const ew = current.cx < 50 ? "west" : "east";
    msgEl.textContent = `Hint: look in the ${ns}${ew} part of the district.`;
    msgEl.className = "msg hint";
  });

  document.getElementById("revealBtn").addEventListener("click", ()=>{
    if(!current) return;
    clearMarkers();
    placeMarker("reveal", current.cx, current.cy);
    panTo(current.cx, current.cy);
    msgEl.textContent = current.name + " — right there.";
    msgEl.className = "msg hint";
    awaitingNext = true;
    setTimeout(nextTarget, 1400);
  });

  document.getElementById("skipBtn").addEventListener("click", nextTarget);

  document.getElementById("mapResetBtn").addEventListener("click", ()=>{
    if(confirm("Reset map-game progress?")){
      mapStats = {found:[], correct:0, total:0, streak:0};
      saveMapStats();
      nextTarget();
    }
  });

  const approxNames = MAP_HITBOXES.filter(h=>h.approx).map(h=>h.name);
  if(approxNames.length){
    document.getElementById("notFoundNote").innerHTML =
      "<b>Heads up:</b> these " + approxNames.length + " streets weren't printed as labels on this specific map, " +
      "so their click zones are estimated from their real-world location instead of an exact label match — " +
      "give them a bit more leeway: " + approxNames.join(", ") + ".";
  }

  renderMapStats();
  nextTarget();
})();

(function(){
  const STREETS = [

    "Rinehardt Street","Redfish Ln","Meadowside Drive","Chandler Road","Will Smith Circle",
    "Enclave Way","Gainer Dr","Luna Vista Dr","CR 199","McCoy Lane","Paddington Way",

    "Hendelson Lane","Tradesman Park Drive","Spring Garden Drive","Corsica Loop","CR 394",
    "Swindoll Ln","Finley Street","Duroc Drive","Holland Street","Lismore Street",
    "Emory Fields Drive","Alliance Blvd","Paola St","Bethpage","CR 108","Anderson Street",
    "CR 197","Comal Run","Lookout Circle","Liard River Road","West Doucet","Waterway Avenue",
    "Creek Bend Drive","CR 119","Grisham Street","New Technology Blvd","Green Pasture Drive",
    "Durango Downs Dr","Little Elm Way","Destiny Ln","Jacobs Well Dr","Ed Schmidt Blvd",
    "Chris Kelley Blvd","CR 134","Winterfield Drive","Marvin Cove","Methodius Drive",
    "Haybarn","CR 160","Schneider Blvd","Live Oak Street","CR 100","South Pauley",
    "Emory Crossing Blvd","Fistral Drive","Simmental Loop","Orchard Way",
    "Bridges at Cross Creek Blvd","Bassano Drive","West Street","Limmer Loop",
    "Janis Mae Drive","Paige Bend","CR 198","Mager Ln","Creston Street","Hereford Loop",
    "Main Street","Stewart Drive","Dana Drive","CR 131","Purple Sage","US 79","Clarks Way",
    "Tall Oak Drive","Cassandra Drive","CR 132","Adrianna","Taylor Street","Rock Daisy Trl",
    "San Antonio Riverwalk","Flora Blvd","Hyltin Street","Rowe Lane","Martin Lane",
    "Wiltshire Drive","Cottonwood Drive","Axis Deer","Apache Pass","Brooklands Blvd",
    "Cyril Drive","Reagan Wells","Mossy Rock Dr","Thomas Park Drive","Rio Grande",
    "Danish Drive","Hibiscus Dr","Carol Drive","North Ash Cove","Decker Drive",
    "Nueces River Trail"
  ];

  const SUFFIXES = ["Ln","Dr","St","Rd","Way","Loop","Cv","Cove","Blvd","Ave","Trl","Pl","Circle","Drive","Street","Lane","Road","Bend","Run","Pass"];
  const REAL_SET = new Set(STREETS.map(s=>s.toLowerCase()));

  function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
  function pick(arr){return arr[randInt(0,arr.length-1)];}
  function isNumberedRoad(s){return /^(CR|SH|US|FM)\s*\d+$/i.test(s.trim());}

  function makeDecoy(usedDecoys){
    let attempt, tries=0;
    do{
      tries++;
      if(tries>40){ attempt = pick(STREETS)+" "+randInt(2,9); break; }
      const base = pick(STREETS);
      if(isNumberedRoad(base)){
        const prefix = base.split(" ")[0];
        attempt = prefix+" "+randInt(100,430);
      } else {
        const words = base.split(" ");
        if(words.length>1){
          attempt = words.slice(0,-1).join(" ")+" "+pick(SUFFIXES);
        } else {
          attempt = pick(STREETS).split(" ")[0]+" "+pick(SUFFIXES);
        }
      }
    } while(REAL_SET.has(attempt.toLowerCase()) || usedDecoys.has(attempt.toLowerCase()));
    usedDecoys.add(attempt.toLowerCase());
    return attempt;
  }

  function maskStreet(s){
    return s.split(" ").map(word=>word.replace(/[A-Za-z]/g,(ch,i)=> i===0?ch:"_")).join(" ");
  }
  function normalize(s){ return s.toLowerCase().replace(/\./g,"").replace(/\s+/g," ").trim(); }

  let mastered = new Set(JSON.parse(localStorage.getItem("hfr_mastered")||"[]"));
  let stats = JSON.parse(localStorage.getItem("hfr_stats")||'{"correct":0,"total":0,"streak":0,"bestStreak":0}');
  let mode = "mixed";
  let current = null;

  const quizPanel = document.getElementById("quizPanel");
  const logList = document.getElementById("logList");

  function saveProgress(){
    localStorage.setItem("hfr_mastered", JSON.stringify([...mastered]));
    localStorage.setItem("hfr_stats", JSON.stringify(stats));
    renderStats();
  }
  function renderStats(){
    document.getElementById("statMastered").textContent = mastered.size;
    document.getElementById("statStreak").textContent = stats.streak;
    const acc = stats.total ? Math.round((stats.correct/stats.total)*100) : 0;
    document.getElementById("statAcc").textContent = acc+"%";
  }
  function logEntry(ok, text){
    const li = document.createElement("li");
    li.className = ok ? "ok" : "bad";
    li.innerHTML = `<span class="code">${ok ? "10-4" : "RETRY"}</span> ${text}`;
    logList.prepend(li);
    while(logList.children.length > 8){ logList.removeChild(logList.lastChild); }
  }
  function recordResult(ok){
    stats.total++;
    if(ok){ stats.correct++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak); }
    else { stats.streak = 0; }
    saveProgress();
  }
  function pickStreetWeighted(){
    const unmastered = STREETS.filter(s=>!mastered.has(s));
    const pool = unmastered.length ? unmastered : STREETS;
    return pick(pool);
  }
  function activeModeFor(){
    if(mode !== "mixed") return mode;
    return pick(["flash","mc","type"]);
  }
  function nextQuestion(){
    const type = activeModeFor();
    if(type === "flash") renderFlash();
    else if(type === "mc") renderMC();
    else renderType();
  }
  function modeTag(label){ return `<div class="mode-tag">${label}</div>`; }

  function renderFlash(){
    const street = pickStreetWeighted();
    current = {type:"flash", street};
    quizPanel.innerHTML = `
      ${modeTag("FLASHCARD")}
      <div class="q-number">DO YOU KNOW THIS STREET?</div>
      <div class="prompt">${street}</div>
      <div class="flash-actions">
        <button class="btn btn-know" id="knowBtn">I know it</button>
        <button class="btn btn-study" id="studyBtn">Still learning</button>
      </div>`;
    document.getElementById("knowBtn").onclick = ()=>{
      mastered.add(street); recordResult(true); logEntry(true, street); nextQuestion();
    };
    document.getElementById("studyBtn").onclick = ()=>{
      mastered.delete(street); recordResult(false); logEntry(false, street); nextQuestion();
    };
  }

  function renderMC(){
    const street = pickStreetWeighted();
    const usedDecoys = new Set();
    const decoys = [makeDecoy(usedDecoys), makeDecoy(usedDecoys), makeDecoy(usedDecoys)];
    const options = [street, ...decoys].sort(()=>Math.random()-0.5);
    current = {type:"mc", street};
    quizPanel.innerHTML = `
      ${modeTag("MULTIPLE CHOICE")}
      <div class="q-number">WHICH OF THESE IS AN ACTUAL STREET IN YOUR AREA?</div>
      <div class="mc-options" id="mcOptions">
        ${options.map(o=>`<button class="mc-opt" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join("")}
      </div>
      <div class="feedback" id="mcFeedback"></div>
      <div class="next-row" id="mcNextRow" style="display:none;">
        <button class="btn btn-next" id="mcNext">Next &rarr;</button>
      </div>`;
    const buttons = quizPanel.querySelectorAll(".mc-opt");
    buttons.forEach(btn=>{
      btn.onclick = ()=>{
        buttons.forEach(b=>b.disabled=true);
        const val = btn.getAttribute("data-val");
        const ok = val === street;
        btn.classList.add(ok ? "correct" : "wrong");
        if(!ok) buttons.forEach(b=>{ if(b.getAttribute("data-val")===street) b.classList.add("correct"); });
        const fb = document.getElementById("mcFeedback");
        fb.textContent = ok ? "Correct." : `That one's not real — the actual street is "${street}".`;
        fb.className = "feedback " + (ok ? "ok" : "bad");
        if(ok) mastered.add(street);
        recordResult(ok); logEntry(ok, street);
        document.getElementById("mcNextRow").style.display = "block";
        document.getElementById("mcNext").onclick = nextQuestion;
      };
    });
  }

  function renderType(){
    let street = pickStreetWeighted(), tries=0;
    while(isNumberedRoad(street) && tries<20){ street = pickStreetWeighted(); tries++; }
    current = {type:"type", street};
    quizPanel.innerHTML = `
      ${modeTag("TYPE IT")}
      <div class="q-number">TYPE THE FULL STREET NAME</div>
      <div class="prompt">${maskStreet(street)}</div>
      <div class="type-row">
        <input class="type-input" id="typeInput" autocomplete="off" placeholder="Start typing...">
        <button class="btn" id="typeSubmit">Submit</button>
      </div>
      <div class="feedback" id="typeFeedback"></div>
      <div class="next-row" id="typeNextRow" style="display:none;">
        <button class="btn btn-next" id="typeNext">Next &rarr;</button>
      </div>`;
    const input = document.getElementById("typeInput");
    input.focus();
    function submit(){
      const val = input.value.trim();
      if(!val) return;
      const ok = normalize(val) === normalize(street);
      const fb = document.getElementById("typeFeedback");
      input.disabled = true; document.getElementById("typeSubmit").disabled = true;
      fb.textContent = ok ? "Correct." : `Not quite — it's "${street}".`;
      fb.className = "feedback " + (ok ? "ok" : "bad");
      if(ok) mastered.add(street);
      recordResult(ok); logEntry(ok, street);
      document.getElementById("typeNextRow").style.display = "block";
      document.getElementById("typeNext").onclick = nextQuestion;
    }
    document.getElementById("typeSubmit").onclick = submit;
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  }

  document.querySelectorAll(".study-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".study-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      mode = tab.getAttribute("data-mode");
      nextQuestion();
    });
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Reset all study-mode progress?")){
      mastered = new Set();
      stats = {correct:0,total:0,streak:0,bestStreak:0};
      saveProgress();
      nextQuestion();
    }
  });

  renderStats();
  nextQuestion();
})();
</script>
</body>
</html>
